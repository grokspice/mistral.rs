name: gemma tie probe
on:
  push:
    branches: ['grokspice/gemma-tie-probe-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo test -p mistralrs-core --lib -- models::gemma::tests models::gemma2::tests
